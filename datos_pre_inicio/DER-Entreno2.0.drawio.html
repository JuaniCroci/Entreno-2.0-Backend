dería por uno o más productos a la vez y puede realizar más de un ingreso a lo largo del tiempo&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;El stock de un producto se calcula como la diferencia entre la sumatoria de los ingresos y la sumatoria de los pedidos realizados. El stock se actualiza cuando:&amp;lt;br&amp;gt;A. se registra un ingreso&amp;lt;br&amp;gt;B. se registra un pedido realizado&amp;lt;br&amp;gt;C. se cancela un pedido: se restituye el stock&amp;lt;br&amp;gt;(*) cuando se registra un producto se prevee que se agregue un stock inicial sin ingreso&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;Un producto puede tener uno o más descuentos asociados. Los descuentos aplican un porcentaje de bonificación al subtotal del producto si se alcanza la cantidad mínima para un pedido&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;Un cliente debe registrarse en el sistema para realizar productos&amp;lt;/li&amp;gt;&amp;lt;/ol&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;420\&quot; x=\&quot;1050\&quot; y=\&quot;-100\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;Qo58SnQ62hcUtvcfC56i-27\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;Qo58SnQ62hcUtvcfC56i-22\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;shape=connector;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=default;align=center;verticalAlign=middle;fontFamily=Helvetica;fontSize=11;fontColor=default;labelBackgroundColor=default;endArrow=none;endFill=0;\&quot; target=\&quot;Qo58SnQ62hcUtvcfC56i-26\&quot; value=\&quot;\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;Qo58SnQ62hcUtvcfC56i-35\&quot; connectable=\&quot;0\&quot; parent=\&quot;Qo58SnQ62hcUtvcfC56i-27\&quot; style=\&quot;edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];fontFamily=Helvetica;fontSize=11;fontColor=default;labe
