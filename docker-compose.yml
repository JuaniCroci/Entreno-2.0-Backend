services:
  mysql:
    image: mysql:8.0
    container_name: entreno-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-entreno_root}
      MYSQL_DATABASE: ${DB_NAME:-entreno}
      MYSQL_USER: ${DB_USER:-entreno}
      MYSQL_PASSWORD: ${DB_PASSWORD:-entreno}
    ports:
      - '${DB_HOST_PORT:-3307}:3306'
    volumes:
      - entreno_mysql_data:/var/lib/mysql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    command: ['--default-authentication-plugin=mysql_native_password']
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u$${MYSQL_USER}', '-p$${MYSQL_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  entreno_mysql_data:
